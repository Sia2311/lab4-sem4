name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Check backend start
        run: timeout 10s npm run dev || code=$?; if [ "$code" = "124" ]; then exit 0; else exit "$code"; fi
        working-directory: backend
        env:
          PORT: 4000
          JWT_SECRET: secret_key
          MONGO_URI: mongodb://127.0.0.1:27017/lab4_incidents

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend